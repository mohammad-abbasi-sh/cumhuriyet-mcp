[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cumhuriyet-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for cumhuriyet.com.tr news (breaking news, headlines, articles, search)"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
cumhuriyet-mcp = "cumhuriyet_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cumhuriyet_mcp"]
